<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" width="400" height="700">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1a3a"/><stop offset="0.55" stop-color="#8a3a3c"/><stop offset="1" stop-color="#e0773a"/>
    </linearGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#3a1d24"/><line x1="0" y1="0" x2="0" y2="6" stroke="#120a10" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="400" height="700" fill="url(#sky)"/>
  <path d="M0 520 L0 380 L40 380 L40 330 L70 330 L70 300 L84 280 L98 300 L98 400 L300 400 L300 330 L320 300 L340 330 L340 360 L372 360 L372 400 L400 400 L400 520 Z" fill="#3a2038" opacity="0.85"/>
  <path d="M0 700 L0 560 L400 560 L400 700 Z" fill="#261428"/>
  <ellipse cx="205" cy="662" rx="90" ry="12" fill="#120a10" opacity="0.6"/>
  <g stroke="#120a10" stroke-linejoin="miter">
  <!-- far arm (in shadow) -->
  <path d="M266 204 L288 216 L294 296 L282 300 L264 296 Z" fill="#4f3624" stroke-width="4"/>
  <path d="M266 296 L284 298 L280 372 L266 372 Z" fill="#3a1d24" stroke-width="4"/>
  <path d="M262 370 L284 370 L288 392 L274 400 L262 392 Z" fill="#3a1d24" stroke-width="4"/>
  <!-- legs: worn trousers -->
  <path d="M206 372 L250 368 L258 500 L254 612 L226 612 L222 500 Z" fill="#2a1e2a" stroke-width="4"/>
  <path d="M150 372 L210 372 L198 500 L190 614 L160 614 L158 500 Z" fill="#4a3a48" stroke-width="4"/>
  <path d="M184 380 L210 372 L198 500 L190 614 L178 614 L182 500 Z" fill="#2a1e2a" stroke="none"/>
  <path d="M164 500 L176 494 M166 540 L174 560" stroke="#120a10" stroke-width="2.5" fill="none"/>
  <!-- knee patch -->
  <path d="M160 486 L184 482 L186 506 L162 510 Z" fill="#6b4a33" stroke-width="2.5"/>
  <!-- boots -->
  <path d="M224 606 L256 606 L262 652 L232 656 Z" fill="#1a0f0c" stroke-width="4"/>
  <path d="M156 608 L192 608 L194 650 L136 656 L140 640 Z" fill="#3b2a22" stroke-width="4"/>
  <path d="M176 610 L192 608 L194 650 L172 652 Z" fill="#1a0f0c" stroke="none"/>
  <path d="M146 642 L190 638" stroke="#a8774f" stroke-width="2"/>
