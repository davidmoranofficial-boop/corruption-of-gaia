  <path d="M138 200 L196 184 L214 184 L270 200 L264 262 L250 330 L258 390 L146 392 L156 330 L142 262 Z" fill="#6b4a33" stroke-width="5"/>
  <path d="M222 190 L268 202 L262 262 L248 330 L256 388 L222 390 L232 300 Z" fill="#2a1820" stroke="none"/>
  <path d="M146 198 L170 192 L166 260 L150 300 Z" fill="#a8774f" stroke="none"/>
  <path d="M168 330 L176 300 L176 340 Z M210 360 L218 320 L220 366 Z M150 380 L160 352 L162 386 Z" fill="#120a10" stroke="none"/>
  <!-- rope belt -->
  <path d="M142 330 L264 326 L264 340 L142 344 Z" fill="#8a6a40" stroke-width="3"/>
  <path d="M178 342 L172 372 M184 342 L186 370" stroke="#8a6a40" stroke-width="4"/>
  <!-- satchel strap and satchel -->
  <path d="M160 196 L176 190 L262 330 L248 336 Z" fill="#3b2a22" stroke-width="3.5"/>
  <path d="M236 318 L286 314 L292 364 L240 370 Z" fill="#5a3e2c" stroke-width="4"/>
  <path d="M236 318 L286 314 L284 336 L238 340 Z" fill="#3b2a22" stroke-width="3"/>
  <rect x="256" y="334" width="10" height="8" fill="#c99a50" stroke-width="2"/>
  <!-- near arm (lit), bare forearm, fist -->
  <path d="M140 202 L118 216 L114 296 L140 298 Z" fill="#6b4a33" stroke-width="4"/>
  <path d="M146 200 L132 210 L126 290 L134 292 Z" fill="#a8774f" stroke="none"/>
  <path d="M120 294 L142 296 L140 372 L124 372 Z" fill="#eab48a" stroke-width="4"/>
  <path d="M134 300 L142 296 L140 372 L132 372 Z" fill="#3a1d24" stroke="none"/>
  <path d="M120 368 L144 368 L146 392 L130 400 L118 390 Z" fill="#eab48a" stroke-width="4"/>
  <path d="M124 378 L142 378 M124 386 L140 386" stroke-width="2"/>
  <!-- wrist wrap -->
  <path d="M120 354 L142 352 L142 364 L120 366 Z" fill="#d8c8a8" stroke-width="2.5"/>
  <!-- neck -->
  <path d="M190 160 L190 192 Q204 200 218 190 L216 158 Z" fill="#e3a77c" stroke-width="4"/>
  <path d="M190 166 L216 162 L218 190 Q208 196 200 196 L200 176 Z" fill="url(#hatch)" stroke="none"/>
  <path d="M176 192 L194 184 Q204 198 218 184 L236 192 Q206 210 176 192 Z" fill="#4f3624" stroke-width="3.5"/>
  </g>
  <g transform="translate(203 136) scale(0.74) translate(-212 -250)">
    <!-- back hair mass, behind the head -->
    <path d="M152 236 L146 200 L160 168 L262 160 L280 196 L270 250 L258 232 Z" fill="#120a0a"/>
    <!-- face -->
    <path d="M166 186 L254 170 L262 232 L250 282 L214 312 L196 310 L174 284 L160 240 Z" fill="#eab48a" stroke="#120a10" stroke-width="5" stroke-linejoin="miter"/>
    <!-- hard ink shadow, light from the left, with hatching at its edge -->
    <path d="M232 176 L254 170 L262 232 L250 282 L214 312 L210 296 L232 272 L230 248 L240 236 L236 214 Z" fill="#3a1d24"/>
    <path d="M226 270 L232 248 L238 252 L232 274 Z M218 288 L228 278 L232 282 L222 294 Z" fill="#3a1d24"/>
    <path d="M226 258 L222 266 M224 280 L218 286" stroke="#120a10" stroke-width="2"/>
    <!-- cheekbone and under-eye lines -->
    <path d="M168 252 L184 248" stroke="#b06a50" stroke-width="2"/>
    <path d="M176 240 L196 242" stroke="#b06a50" stroke-width="1.5"/>
    <!-- rim light on the near cheek -->
    <path d="M161 238 L169 238 L180 280 L174 284 Z" fill="#ffd2a0"/>
    <!-- ear -->
    <path d="M256 214 Q276 210 274 236 Q272 254 254 258 Z" fill="#3a1d24" stroke="#120a10" stroke-width="4"/>
    <path d="M262 224 Q268 234 262 246" fill="none" stroke="#120a10" stroke-width="2"/>
    <!-- eyes: narrow, sharp, green -->
    <path d="M174 232 Q188 224 202 232 Q188 238 174 232 Z" fill="#f2e6d6" stroke="#120a10" stroke-width="3"/>
    <circle cx="191" cy="232" r="4.5" fill="#3f8a5a"/><circle cx="191" cy="232" r="2" fill="#120a10"/><circle cx="189.5" cy="230.5" r="1" fill="#fff"/>
    <path d="M170 229 L204 228 L200 233 Q188 225 174 233 Z" fill="#120a10"/>
    <path d="M216 230 Q230 222 244 228 Q232 237 216 230 Z" fill="#f2e6d6" stroke="#120a10" stroke-width="3"/>
    <circle cx="229" cy="230" r="4.5" fill="#3f8a5a"/><circle cx="229" cy="230" r="2" fill="#120a10"/><circle cx="227.5" cy="228.5" r="1" fill="#fff"/>
    <path d="M214 228 L246 224 L244 229 Q230 222 216 231 Z" fill="#120a10"/>
    <!-- nose -->
    <path d="M206 236 L200 262 L210 266" fill="none" stroke="#120a10" stroke-width="3.5" stroke-linejoin="miter"/>
    <path d="M206 240 L212 262 L210 266 L202 262 Z" fill="#3a1d24" opacity="0.9"/>
    <!-- mouth: tight line, a little set -->
    <path d="M190 284 L206 282 L222 280" stroke="#120a10" stroke-width="4" stroke-linecap="square" fill="none"/>
    <path d="M198 292 L214 291" stroke="#7a3a30" stroke-width="2.5"/>
    <path d="M200 302 L210 301" stroke="#b06a50" stroke-width="2"/>
    <!-- scuffs: from the street, not the boat -->
    <path d="M176 258 L184 262 M178 264 L185 266" stroke="#b5583e" stroke-width="2"/>
    <!-- hair: big spiky clumps, ink black with brown lights -->
    <path d="M146 214 L150 170 L132 160 L158 148 L146 118 L178 128 L184 92 L206 118 L228 84 L236 120 L270 100 L262 134 L292 136 L270 160 L288 182 L262 182 L270 210 L254 200 L246 222 L238 196 L226 216 L222 194 L206 220 L200 196 L184 222 L180 196 L164 224 L162 198 Z" fill="#1a0f0c" stroke="#120a10" stroke-width="4" stroke-linejoin="miter"/>
    <!-- clump separations -->
    <path d="M184 92 L190 140 M228 84 L222 138 M270 100 L248 146 M146 118 L176 150" stroke="#3a2418" stroke-width="2"/>
    <path d="M156 176 L176 128 L174 172 Z M186 168 L204 116 L206 164 Z M216 166 L230 112 L236 160 Z M240 172 L262 140 L252 178 Z" fill="#5a3522"/>
    <path d="M162 168 L176 136 L172 166 Z M190 160 L202 128 L200 158 Z M220 156 L229 124 L230 150 Z" fill="#a8683c"/>
    <!-- strand falling over the eye -->
    <path d="M200 196 L206 220 L196 238 L198 214 Z" fill="#1a0f0c"/>
    <!-- warm rim on the hair from the sunset -->
    <path d="M146 118 L178 128 L166 132 Z M132 160 L158 148 L150 158 Z M146 214 L150 170 L154 176 L152 206 Z" fill="#ff9a3c"/>
    <!-- brows: heavy, angled down to the nose, stubborn -->
    <path d="M170 210 L200 214 L204 222 L172 218 Z" fill="#120a10"/>
    <path d="M212 222 L218 212 L248 206 L246 214 Z" fill="#120a10"/>
  </g>
</svg>
