<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2340"/><stop offset="1" stop-color="#c2552e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  <!-- torso: rough tunic -->
  <path d="M70 500 L92 418 Q110 384 168 368 L196 352 L238 352 L262 368 Q318 380 336 420 L352 500 Z" fill="#6b4a33" stroke="#120a10" stroke-width="5" stroke-linejoin="miter"/>
